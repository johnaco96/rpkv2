[package]
name = "rpkv2"
version = "0.1.0"
edition = "2024"

[features]
ed25519 = []          # enable real ed25519 verify
dalek_batch = []
afxdp = ["xsk-rs"]   # or "xdp"
dpdk  = ["capsule"]  # optional

[dependencies]
anyhow = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-util", "signal"] }
quinn = { version = "0.11.8", default-features = false, features = ["runtime-tokio", "rustls", "platform-verifier", "log", "bloom"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
hdrhistogram = "7"
futures-util = "0.3"
xsk-rs = { version = "0.6", optional = true }   # example
xdp    = { version = "0.3", optional = true }   # alternative
capsule = { version = "0.1.5", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc","rand_core"], optional = true }
core_affinity = "0.8"
crossbeam = "0.8"
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"
bloomfilter = "1.0"
# fastbloom = "0.9"
siphasher = "1"
hashbrown = "0.14"
blake3 = "1"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
num_cpus = "1"


# Exactly ONE of these features:
rustls = { version = "0.23.31", features = ["aws-lc-rs"], default-features = false }

rustls-pemfile = "2.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
